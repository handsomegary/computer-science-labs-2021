name: C++11 lab checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original course PDFs and companion files
        run: python tools/check_course_materials.py
      - name: Verify retained original sources and local data
        run: python tools/check_source_archive.py
      - name: Verify latest original documents and privacy derivatives
        run: python original_document_archive/check_archive.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: python tools/verify.py --cxx g++
